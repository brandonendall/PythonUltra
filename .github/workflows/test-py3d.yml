name: Test py3d

on:
  push:
    branches:
      - main
      - cg50-new-display
      - "migration/**"
    paths:
      - "ports/sh/modules/py3d/**"
      - "tests/ports/sh/py3d_compat.py"
      - ".github/workflows/test-py3d.yml"
  pull_request:
    branches: [main, cg50-new-display]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run compact py3d regressions
        run: python3 tests/ports/sh/py3d_compat.py
