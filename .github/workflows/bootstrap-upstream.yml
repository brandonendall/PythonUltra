name: Validate source provenance

# Bootstrap is complete. Never import or push over the maintained repository.
on:
  push:
    branches: [main, cg50-new-display, "migration/**"]
    paths:
      - 'UPSTREAM_COMMIT'
      - '.github/workflows/bootstrap-upstream.yml'
  pull_request:
    branches: [main, cg50-new-display]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify maintained source and original provenance
        run: |
          test -s UPSTREAM_COMMIT
          test -f ports/fxcg50/Makefile
          test -f ports/sh/main.c
          test -f LICENSE
          printf 'Repository: %s\nCommit: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          cat UPSTREAM_COMMIT
